---
- name: Open port 443 in iptables
  command: iptables -A INPUT -p tcp --dport 443 -j ACCEPT

- name: Install certbot
  apt:
    pkg:
      - certbot
      - python3-certbot-nginx
    state: present
  become: yes

- name: Install certificate
  shell: certbot --nginx -n --agree-tos --redirect --email {{certbot_mail}} -d {{domain}}{% if include_www is defined and include_www | bool %} -d www.{{domain}}{% endif %} --webroot-path /var/www/{{ domain }}/
